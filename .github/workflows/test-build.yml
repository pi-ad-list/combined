name: Build combined blocklist

on:
  workflow_dispatch:
  schedule:
    - cron: "45 3 */2 * *"

permissions:
  contents: write

concurrency:
  group: combined-blocklist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_OPTIONS: --max-old-space-size=5120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install official AdGuard compiler
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Download OISD Big exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --output downloads/oisd-big.txt \
            https://big.oisd.nl

          test -s downloads/oisd-big.txt

      - name: Download URLhaus and ThreatFox
        shell: bash
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: |
          set -euo pipefail
          : "${ABUSECH_AUTH_KEY:?Missing ABUSECH_AUTH_KEY secret}"
          mkdir -p downloads

          urlhaus_status="$(
            curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 300 \
              --write-out '%{http_code}' \
              --output downloads/urlhaus-hostfile.txt \
              "https://urlhaus-api.abuse.ch/v2/files/exports/${ABUSECH_AUTH_KEY}/hostfile.txt"
          )"

          echo "URLhaus: HTTP ${urlhaus_status}"

          if [ "$urlhaus_status" != "200" ]; then
            echo "::error::URLhaus did not return HTTP 200"
            exit 1
          fi

          test -s downloads/urlhaus-hostfile.txt

          threatfox_status="$(
            curl \
              --proto '=https' \
              --proto-redir '=https' \
              --tlsv1.2 \
              --fail \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --connect-timeout 20 \
              --max-time 300 \
              --write-out '%{http_code}' \
              --output downloads/threatfox-hostfile.txt \
              "https://threatfox-api.abuse.ch/v2/files/exports/${ABUSECH_AUTH_KEY}/hostfile.txt"
          )"

          echo "ThreatFox: HTTP ${threatfox_status}"

          if [ "$threatfox_status" != "200" ]; then
            echo "::error::ThreatFox did not return HTTP 200"
            exit 1
          fi

          test -s downloads/threatfox-hostfile.txt

      - name: Inspect protected feeds
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("node:fs");
          const net = require("node:net");
          const { domainToASCII } = require("node:url");

          const localNames = new Set([
            "localhost",
            "localhost.localdomain",
            "ip6-localhost",
            "ip6-loopback",
          ]);
          const blockingAddresses = new Set([
            "0.0.0.0",
            "127.0.0.1",
            "::",
            "::1",
          ]);

          for (const feed of ["urlhaus", "threatfox"]) {
            const file = `downloads/${feed}-hostfile.txt`;
            const data = fs.readFileSync(file);
            const text = data.toString("utf8").replace(/^\uFEFF/, "");

            if (/^\s*(?:<!doctype\b|<html\b|<head\b|<body\b|\{|\[)/i.test(text)) {
              throw new Error(`${feed}: received HTML or JSON instead of a hosts file`);
            }

            const counts = {
              mappings: 0,
              domains: 0,
              ipTargets: 0,
              singleLabelTargets: 0,
              unusual: 0,
            };
            const examples = [];
            const note = (line, reason) => {
              counts.unusual++;
              if (examples.length < 5) examples.push({ line, reason });
            };

            const lines = text.split(/\r?\n/);

            for (let index = 0; index < lines.length; index++) {
              const line = lines[index].replace(/#.*/, "").trim();
              if (!line || line.startsWith("!")) continue;

              const [address, ...hosts] = line.split(/\s+/);

              if (!blockingAddresses.has(address) || hosts.length === 0) {
                note(index + 1, "not a recognized hosts-file mapping");
                continue;
              }

              counts.mappings++;

              for (const host of hosts) {
                const name = host.replace(/\.$/, "");

                if (localNames.has(name.toLowerCase())) continue;

                if (net.isIP(name)) {
                  counts.ipTargets++;
                  continue;
                }

                if (/[\/:@?#]/.test(name) || name.includes("\\")) {
                  note(index + 1, "hostname contains URL or address separators");
                  continue;
                }

                const ascii = domainToASCII(name);
                const labels = ascii.split(".");
                const valid =
                  ascii.length > 0 &&
                  ascii.length <= 253 &&
                  labels.every(label =>
                    /^[a-z0-9_](?:[a-z0-9_-]{0,61}[a-z0-9_])?$/i.test(label)
                  );

                if (!valid) {
                  note(index + 1, "unrecognized hostname syntax");
                  continue;
                }

                if (net.isIP(ascii)) {
                  counts.ipTargets++;
                } else if (labels.length === 1) {
                  counts.singleLabelTargets++;
                } else {
                  counts.domains++;
                }
              }
            }

            const result =
              `${feed}: ${data.length} bytes; ` +
              `${counts.mappings} mapping rows; ` +
              `${counts.domains} domain targets; ` +
              `${counts.ipTargets} IP targets; ` +
              `${counts.singleLabelTargets} single-label targets; ` +
              `${counts.unusual} unusual items`;

            console.log(result);
            fs.appendFileSync(
              process.env.GITHUB_STEP_SUMMARY,
              `${result}\n\n`
            );

            for (const example of examples) {
              console.log(
                `${feed}: line ${example.line}: ${example.reason}`
              );
            }

            if (counts.domains === 0) {
              throw new Error(`${feed}: no recognizable domain mappings found`);
            }

            if (counts.unusual > 0) {
              console.log(
                `::warning::${feed}: ${counts.unusual} unusual items; ` +
                "the original file is unchanged and will be passed to the compiler"
              );
            }
          }
          NODE

      - name: Compile lists
        shell: bash
        run: |
          set -euo pipefail

          if ! npm run build > compiler.log 2>&1; then
            tail -n 200 compiler.log
            exit 1
          fi

          echo "Source counts and transformation results:"

          grep -E \
            'Start compiling|Original length|Length after applying transformations|Compress|Deduplication|Final length' \
            compiler.log

          test -s dist/combined.txt

      - name: Compress and verify output
        shell: bash
        run: |
          set -euo pipefail

          gzip -9 -c dist/combined.txt > dist/combined.txt.gz
          sha256sum dist/combined.txt.gz > dist/combined.txt.gz.sha256

          {
            echo "## Combined blocklist"
            echo
            echo "compiler_version=$(node -p "require('@adguard/hostlist-compiler/package.json').version")"
            echo "output_bytes=$(wc -c < dist/combined.txt)"
            echo "output_lines=$(wc -l < dist/combined.txt)"
            echo "compressed_bytes=$(wc -c < dist/combined.txt.gz)"
            echo "sha256=$(sha256sum dist/combined.txt | cut -d' ' -f1)"
            echo
            echo "Publishing is disabled while investigating the rule-count decrease."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if ! gh release view blocklist-latest >/dev/null 2>&1; then
            gh release create blocklist-latest \
              --title "Latest combined blocklist" \
              --notes "Automatically generated AdGuard Home blocklist."
          fi

          gh release upload blocklist-latest \
            dist/combined.txt \
            dist/combined.txt.gz \
            dist/combined.txt.gz.sha256 \
            --clobber
